<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    background:#f5f5f5;
}

/*================ LEFT PANEL ================*/

.promo{
    flex:1;
    background:linear-gradient(135deg,#ff6b35,#ff9a5c);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    position:sticky;
    top:0;
    height:100vh;
    overflow:hidden;
}

.promo::before,
.promo::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.10);
}

.promo::before{ width:380px; height:380px; top:-140px; right:-100px; }
.promo::after { width:300px; height:300px; bottom:-120px; left:-80px; }

.promo > *{ position:relative; z-index:1; }

.promo .emoji{ font-size:90px; margin-bottom:10px; }

.promo h1{
    font-size:36px;
    line-height:1.25;
    margin-bottom:12px;
}

.promo p{
    font-size:17px;
    opacity:0.95;
    max-width:380px;
}

.perks{
    margin-top:28px;
    display:flex;
    gap:22px;
    font-size:14px;
    font-weight:500;
}

/*================ RIGHT PANEL ================*/

.panel{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 20px;
}

.card{
    width:100%;
    max-width:440px;
    background:white;
    border-radius:18px;
    padding:36px 34px;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
}

.card h2{ font-size:28px; color:#ff6b35; margin-bottom:4px; }

.card .sub{ color:#888; font-size:14px; margin-bottom:24px; }

.field{ margin-bottom:16px; }

.field label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
    color:#444;
}

.input-wrap{ position:relative; }

.input-wrap input,
.field select,
.field textarea{
    width:100%;
    padding:12px 16px;
    border:2px solid #e5e5e5;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:0.2s;
    background:white;
}

.field textarea{ height:84px; resize:none; }

.input-wrap input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#ff6b35;
    box-shadow:0 0 0 4px rgba(255,107,53,0.12);
}

.input-wrap.has-toggle input{ padding-right:48px; }

.toggle{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    font-size:18px;
    cursor:pointer;
    padding:8px;
}

.signup-btn{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:none;
    border-radius:10px;
    background:#ff6b35;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

.signup-btn:hover{ background:#e85a28; }

.signup-btn:disabled{ background:#ccc; cursor:not-allowed; }

.login-text{
    text-align:center;
    margin-top:22px;
    font-size:14px;
    color:#777;
}

.login-text a{ color:#ff6b35; font-weight:600; text-decoration:none; }

.login-text a:hover{ text-decoration:underline; }

@media (max-width:800px){
    .promo{ display:none; }
    body{ background:linear-gradient(135deg,#ff6b35,#ff9a5c); }
}

</style>

</head>

<body>

<section class="promo">

    <div class="emoji">🍕</div>

    <h1>Join us and get your first meal delivered fast.</h1>

    <p>Create your free account in less than a minute and start ordering from the best restaurants near you.</p>

    <div class="perks">
        <span>⚡ Fast delivery</span>
        <span>🍲 Fresh &amp; hot</span>
        <span>💸 Great offers</span>
    </div>

</section>

<section class="panel">

    <div class="card">

        <h2>Create Account 🎉</h2>
        <div class="sub">Sign up to start ordering delicious food</div>

        <form action="register" method="post" id="signupForm">

            <div class="field">
                <label for="name">Name</label>
                <div class="input-wrap">
                    <input type="text" id="name" name="name"
                           placeholder="Enter your name" required autocomplete="name">
                </div>
            </div>

            <div class="field">
                <label for="email">Email ID</label>
                <div class="input-wrap">
                    <input type="email" id="email" name="email"
                           placeholder="Enter your email" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap has-toggle">
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="new-password">
                    <button type="button" class="toggle" id="toggle" title="Show / hide password">👁️</button>
                </div>
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" name="address"
                          placeholder="Enter your delivery address" required></textarea>
            </div>

            <div class="field">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="Customer" selected>Customer</option>
                    <option value="Restaurant Admin">Restaurant Admin</option>
                    <option value="Super Admin">Super Admin</option>
                </select>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>

        </form>

        <div class="login-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>

    </div>

</section>

<script>

document.getElementById("toggle").addEventListener("click", function () {
    var pw = document.getElementById("password");
    var hidden = pw.type === "password";
    pw.type = hidden ? "text" : "password";
    this.textContent = hidden ? "🙈" : "👁️";
});

document.getElementById("signupForm").addEventListener("submit", function () {
    var btn = document.getElementById("signupBtn");
    btn.disabled = true;
    btn.textContent = "Creating your account...";
});

</script>

</body>
</html>
